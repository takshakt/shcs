<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Under Maintenance - Sanatan Hindu Cultural Society, Sutton</title>
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #FF6600 0%, #FF8F00 50%, #FFB300 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .maintenance-container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
    }

    .logo {
      width: 120px;
      height: auto;
      margin-bottom: 24px;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    h1 {
      color: #1a1a2e;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .message {
      color: #444;
      font-size: 17px;
      line-height: 1.7;
      margin-bottom: 24px;
    }

    .message a {
      color: #FF6600;
      text-decoration: none;
      font-weight: 600;
    }

    .message a:hover {
      text-decoration: underline;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: #FF6600;
      margin: 24px auto;
      border-radius: 2px;
    }

    .footer-text {
      color: #888;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="maintenance-container">
    <img src="images/SHCS-3.png" alt="SHCS Logo" class="logo">
    <div class="icon">🛠️</div>
    <h1>Website Under Maintenance</h1>
    <p class="message">
      Our website is currently being updated. If you need any information in the meantime, please feel free to contact
      us at <a href="mailto:shcs.sutton@gmail.com">shcs.sutton@gmail.com</a>
    </p>
    <div class="divider"></div>
    <p class="footer-text">Sanatan Hindu Cultural Society, Sutton</p>
  </div>
</body>

</html>
